services:

  backend:
    build:
      context: ./server
      #Build the backend image using the Dockerfile inside the server folder.
    container_name: chat-backend
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
      #Take the environment variables from server/.env and give them to the backend container.
    networks:
      - chat-network

  frontend:
    build:
      context: ./clients
      args:
        REACT_APP_SERVER_URL: http://localhost:8000
        REACT_APP_CLIENT_ID: 956633349299-2nnh06puu84eq19qjrtcdud52qve2l43.apps.googleusercontent.com
    container_name: chat-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chat-network

networks:
  chat-network: